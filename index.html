<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Coming Soon</title>
    <meta name="description" content="UX Design Leader — Portfolio coming soon.">
    <meta property="og:title" content="Portfolio — Coming Soon">
    <meta property="og:description" content="UX Design Leader — Portfolio coming soon.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #0C0C0C;
            --color-surface: #141414;
            --color-text: #E8E4DF;
            --color-text-muted: #807A73;
            --color-accent: #C4A47A;
            --color-accent-dim: rgba(196, 164, 122, 0.12);
            --color-rule: rgba(228, 224, 219, 0.08);
            --font-display: 'DM Serif Display', Georgia, serif;
            --font-body: 'Instrument Sans', system-ui, sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Subtle grain texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            pointer-events: none;
            z-index: 100;
        }

        /* Layout */
        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem;
            position: relative;
        }

        /* Decorative corner marks */
        .corner-mark {
            position: fixed;
            width: 24px;
            height: 24px;
            border-color: var(--color-rule);
            border-style: solid;
            z-index: 10;
            opacity: 0;
            animation: cornerFade 1s ease-out 1.8s forwards;
        }
        .corner-mark--tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
        .corner-mark--tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
        .corner-mark--bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
        .corner-mark--br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }

        /* Main content */
        .content {
            text-align: center;
            max-width: 640px;
        }

        .label {
            font-family: var(--font-body);
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .label::before,
        .label::after {
            content: '—';
            margin: 0 0.75em;
            opacity: 0.4;
        }

        .title {
            font-family: var(--font-display);
            font-size: clamp(2.75rem, 7vw, 5.5rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.015em;
            color: var(--color-text);
            margin-bottom: 0.2em;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .title em {
            font-style: italic;
            color: var(--color-accent);
        }

        .divider {
            width: 48px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
            margin: 2rem auto;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.8s forwards;
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 1.0625rem;
            font-weight: 400;
            line-height: 1.65;
            color: var(--color-text-muted);
            max-width: 420px;
            margin: 0 auto 3rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1s forwards;
        }

        /* Contact link */
        .contact {
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            font-family: var(--font-body);
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-text);
            text-decoration: none;
            padding: 0.875rem 2rem;
            border: 1px solid var(--color-rule);
            border-radius: 0;
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.2s forwards;
            position: relative;
            overflow: hidden;
        }

        .contact::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--color-accent-dim);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .contact:hover::before {
            transform: scaleX(1);
        }

        .contact:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .contact span {
            position: relative;
            z-index: 1;
        }

        .contact-arrow {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
            width: 16px;
            height: 16px;
        }

        .contact:hover .contact-arrow {
            transform: translateX(3px);
        }

        /* Footer */
        .footer {
            padding: 2rem;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.6s forwards;
        }

        .footer-text {
            font-family: var(--font-body);
            font-size: 0.6875rem;
            letter-spacing: 0.08em;
            color: var(--color-text-muted);
            opacity: 0.5;
        }

        /* Ambient glow */
        .glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196, 164, 122, 0.04) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: breathe 8s ease-in-out infinite;
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cornerFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .page { padding: 2rem 1.5rem; }
            .corner-mark { display: none; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="corner-mark corner-mark--tl"></div>
    <div class="corner-mark corner-mark--tr"></div>
    <div class="corner-mark corner-mark--bl"></div>
    <div class="corner-mark corner-mark--br"></div>

    <main class="page">
        <div class="content">
            <p class="label">Portfolio</p>

            <h1 class="title">Something <em>new</em> is<br>on the way</h1>

            <div class="divider"></div>

            <p class="subtitle">
                UX Design Leader crafting thoughtful, human-centered experiences. Full portfolio and case studies launching soon.
            </p>

            <a href="mailto:hello@yourdomain.com" class="contact">
                <span>Get in Touch</span>
                <svg class="contact-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="8" x2="13" y2="8"/>
                    <polyline points="9,4 13,8 9,12"/>
                </svg>
            </a>
        </div>
    </main>

    <footer class="footer">
        <p class="footer-text">© 2026 — All rights reserved</p>
    </footer>

</body>
</html>
