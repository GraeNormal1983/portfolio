function useWindowWidth() {
  const [width, setWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(() => {
    const handleResize = () => setWidth(window.innerWidth);
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);
  return width;
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
function getFamilyStats(family, weeksArr) {
  const weeks = family.requests.map(r => r.week);
  const uniqueWeeks = [...new Set(weeks)];
  const allCats = family.requests.flatMap(r => r.categories);
  const catCounts = {};
  allCats.forEach(c => { catCounts[c] = (catCounts[c]||0) + 1; });
  const primaryCat = Object.entries(catCounts).sort((a,b) => b[1]-a[1])[0]?.[0] || "other";
  const wks = weeksArr || WEEKS;
  const lastWeek = wks.filter(w => weeks.includes(w)).pop();
  const firstWeek = wks.filter(w => weeks.includes(w))[0];
  return { weekCount: uniqueWeeks.length, primaryCat, lastWeek, firstWeek, allCats: [...new Set(allCats)] };
}

    const pastRequests = family.requests.filter(r => r.week !== LATEST_WEEK);

    const weeks = pastRequests.length;
    const cats = [...new Set(pastRequests.flatMap(r => r.categories))];
    const hasPraise = cats.includes("praise");
    const praiseRequests = pastRequests.filter(r => r.categories.includes("praise"));
    const nonPraiseRequests = pastRequests.filter(r => !r.categories.includes("praise"));

    // Build a concise narrative
    const parts = [];
    parts.push(`On the prayer list for ${weeks} prior week${weeks > 1 ? "s" : ""}.`);

    // Summarize the themes
    const themeMap = {
      medical: "health/medical needs",
      employment: "employment concerns",
      salvation: "salvation prayers for loved ones",
      spiritual: "spiritual growth",
      family: "family matters",
      grief: "grief and loss",
      missions: "missions/outreach",
      transition: "life transitions",
    };
    const themes = cats.filter(c => c !== "praise" && c !== "other").map(c => themeMap[c] || c).filter(Boolean);
    if (themes.length > 0) {
      parts.push(`Primary themes: ${themes.join(", ")}.`);
    }

    // Most recent past request for context
    const mostRecentPast = nonPraiseRequests[nonPraiseRequests.length - 1];
    if (mostRecentPast) {
      parts.push(`Most recent prior request (${activeWeekLabels[mostRecentPast.week]}): "${mostRecentPast.text.length > 120 ? mostRecentPast.text.substring(0, 120) + "…" : mostRecentPast.text}"`);

    // Praise items

      const praiseTexts = praiseRequests.map(r => `${activeWeekLabels[r.week]}: ${r.text.length > 80 ? r.text.substring(0, 80) + "…" : r.text}`);
      parts.push(`Praise: ${praiseTexts.join(" | ")}`);
    }

    return parts.join(" ");
  }

  function getPraiseItems(family) {
    return family.requests.filter(r => r.categories.includes("praise"));

  function getPrayerFilteredList() {
    if (prayerFilterMode === "all") {
      return [...currentWeekFamilies].sort((a, b) => a.family.localeCompare(b.family));

          const firstChar = f.family.charAt(0).toUpperCase().charCodeAt(0);
          return firstChar >= lo && firstChar <= hi;

        .sort((a, b) => a.family.localeCompare(b.family));

    if (prayerFilterMode === "day") {
      return prayerDays[prayerDay] || [];

    return currentWeekFamilies;

                    padding: "8px 14px", borderRadius: 8, border: "none",
                    background: "#1d2252", color: "#e8ecf4",
                    fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 600,
                    cursor: "pointer",
                  }}
                >
                  + Add Family
                </button>
              </div>

              {/* Add family form */}
              {showAddFamily && (
                <div style={{
                  background: "rgba(255,255,255,0.9)", border: "1px solid #cdd3e3",
                  borderRadius: 10, padding: 20, marginBottom: 16,
                }}>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 14, fontWeight: 600, color: "#1d2252", marginBottom: 12}}>
                    Add New Family
                  </div>
                  <div style={{display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end"}}>
                    <div style={{flex: 1, minWidth: 200}}>
                      <label style={{fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 600, color: "#4a5580", display: "block", marginBottom: 4}}>
                        Family Name (Last, First & Spouse)
                      </label>
                      <input
                        type="text"
                        value={newFamilyName}
                        onChange={e => setNewFamilyName(e.target.value)}
                        placeholder="e.g. Smith, John & Jane"
                        style={{
                          width: "100%", padding: "8px 12px", borderRadius: 8,
                          border: "1px solid #b8c1d6", fontFamily: "'Montserrat', sans-serif",
                          fontSize: 13, color: "#1d2252", background: "#f5f7fb",
                          boxSizing: "border-box",
                        }}
                      />
                    </div>
                    <div style={{minWidth: 160}}>
                      <label style={{fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 600, color: "#4a5580", display: "block", marginBottom: 4}}>
                        Assigned Elder
                      </label>
                      <select
                        value={newFamilyElder}
                        onChange={e => setNewFamilyElder(e.target.value)}
                        style={{
                          width: "100%", padding: "8px 12px", borderRadius: 8,
                          border: "1px solid #b8c1d6", fontFamily: "'Montserrat', sans-serif",
                          fontSize: 13, color: "#1d2252", background: "#f5f7fb",
                        }}
                      >
                        <option value="">None</option>
                        {[...new Set(baseData.map(f => f.elder).filter(Boolean))].sort().map(e => (
                          <option key={e} value={e}>{e}</option>
                        ))}
                      </select>
                    </div>
                    <button
                      onClick={() => {
                        if (!newFamilyName.trim()) return;
                        setAddedFamilies(prev => [...prev, {
                          family: newFamilyName.trim(),
                          elder: newFamilyElder,
                          deacon: "",
                          requests: [],
                        }]);
                        setNewFamilyName("");
                        setNewFamilyElder("");
                        setShowAddFamily(false);
                      }}
                      disabled={!newFamilyName.trim()}
                      style={{
                        padding: "8px 20px", borderRadius: 8, border: "none",
                        background: newFamilyName.trim() ? "#1d2252" : "#cdd3e3",
                        color: newFamilyName.trim() ? "#e8ecf4" : "#8b92b3",
                        fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 600,
                        cursor: newFamilyName.trim() ? "pointer" : "default",
                      }}
                    >
                      Add
                    </button>
                    <button
                      onClick={() => { setShowAddFamily(false); setNewFamilyName(""); setNewFamilyElder(""); }}
                      style={{
                        padding: "8px 14px", borderRadius: 8,
                        border: "1px solid #b8c1d6", background: "transparent",
                        fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 500,
                        color: "#4a5580", cursor: "pointer",
                      }}
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              )}

              {/* Family list or archived list */}
              <div style={{
                background: "rgba(255,255,255,0.7)", border: "1px solid #cdd3e3",
                borderRadius: 10, overflow: "hidden",
              }}>
                {/* Header row */}
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr 140px 100px",
                  padding: "10px 16px", borderBottom: "1px solid #cdd3e3",
                  fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 700,
                  color: "#4a5580", textTransform: "uppercase", letterSpacing: 1,
                }}>
                  <span>Family</span>
                  <span>Elder</span>
                  <span style={{textAlign: "right"}}>Actions</span>
                </div>

                {/* Rows */}
                {(() => {
                  const list = showArchived
                    ? archivedFamilies.map(name => {
                        const orig = [...baseData, ...addedFamilies].find(f => f.family === name);
                        return orig || { family: name, elder: "", deacon: "", requests: [] };
                      })
                    : activeData
                        .filter(f => {
                          if (adminSearch && !f.family.toLowerCase().includes(adminSearch.toLowerCase())) return false;
                          if (adminElderFilter === "none" && f.elder) return false;
                          if (adminElderFilter !== "all" && adminElderFilter !== "none" && f.elder !== adminElderFilter) return false;
                          return true;
                        })
                        .sort((a, b) => a.family.localeCompare(b.family));

                  if (list.length === 0) return (
                    <div style={{padding: 32, textAlign: "center", fontFamily: "'Montserrat', sans-serif", fontSize: 14, color: "#555d80"}}>
                      {showArchived ? "No archived families" : "No families match your filters"}
                    </div>
                  );

                  return list.map((f, i) => (
                    <div key={f.family} style={{
                      display: "grid", gridTemplateColumns: "1fr 140px 100px",
                      padding: "10px 16px", alignItems: "center",
                      borderBottom: i < list.length - 1 ? "1px solid #e4e8f2" : "none",
                      background: i % 2 === 0 ? "transparent" : "rgba(245,247,251,0.5)",
                    }}>
                      <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 500, color: "#1d2252"}}>
                        {f.family}
                      </span>
                      <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, color: f.elder ? "#4a5580" : "#596a8a"}}>
                        {f.elder || "—"}
                      </span>
                      <div style={{textAlign: "right"}}>
                        {showArchived ? (
                          <button
                            onClick={() => setArchivedFamilies(prev => prev.filter(n => n !== f.family))}
                            style={{
                              padding: "4px 10px", borderRadius: 6,
                              border: "1px solid #b8c1d6", background: "transparent",
                              fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 600,
                              color: "#0d7a8b", cursor: "pointer",
                            }}
                          >
                            Restore
                          </button>
                        ) : (
                          <button
                            onClick={() => {
                              setArchivedFamilies(prev => [...prev, f.family]);
                              if (selectedFamily === f.family) setSelectedFamily(null);
                            }}
                            style={{
                              padding: "4px 10px", borderRadius: 6,
                              border: "1px solid #b8c1d6", background: "transparent",
                              fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 600,
                              color: "#c43e3e", cursor: "pointer",
                            }}
                          >
                            Archive
                          </button>
                        )}
                      </div>
                    </div>
                  ));
                })()}
              </div>
              <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#596a8a", marginTop: 10}}>
                {showArchived ? `${archivedFamilies.length} archived` : `${activeData.filter(f => {
                  if (adminSearch && !f.family.toLowerCase().includes(adminSearch.toLowerCase())) return false;
                  if (adminElderFilter === "none" && f.elder) return false;
                  if (adminElderFilter !== "all" && adminElderFilter !== "none" && f.elder !== adminElderFilter) return false;
                  return true;
                }).length} families`}
              </div>
            </div>
          )}

          {/* ── ELDER REASSIGNMENT ── */}
          {adminSection === "reassign" && (
            <div>
              {/* Bulk reassignment */}
              <div style={{
                background: "rgba(255,255,255,0.9)", border: "1px solid #cdd3e3",
                borderRadius: 10, padding: 20, marginBottom: 24,
              }}>
                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 14, fontWeight: 600, color: "#1d2252", marginBottom: 4}}>
                  Bulk Reassignment
                </div>
                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#555d80", marginBottom: 16}}>
                  Move all families from one elder to another
                </div>
                <div style={{display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center"}}>
                  <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, color: "#4a5580"}}>Move all families from</span>
                  <select
                    value={bulkSourceElder}
                    onChange={e => setBulkSourceElder(e.target.value)}
                    style={{
                      padding: "8px 12px", borderRadius: 8, border: "1px solid #b8c1d6",
                      fontFamily: "'Montserrat', sans-serif", fontSize: 13,
                      color: "#1d2252", background: "#f5f7fb",
                    }}
                  >
                    <option value="">Select elder…</option>
                    {[...new Set(activeData.map(f => f.elder).filter(Boolean))].sort().map(e => (
                      <option key={e} value={e}>{e}</option>
                    ))}
                    <option value="__none__">None assigned</option>
                  </select>
                  <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, color: "#4a5580"}}>to</span>
                  <select
                    value={bulkTargetElder}
                    onChange={e => setBulkTargetElder(e.target.value)}
                    style={{
                      padding: "8px 12px", borderRadius: 8, border: "1px solid #b8c1d6",
                      fontFamily: "'Montserrat', sans-serif", fontSize: 13,
                      color: "#1d2252", background: "#f5f7fb",
                    }}
                  >
                    <option value="">Select elder…</option>
                    {[...new Set(activeData.map(f => f.elder).filter(Boolean))].sort().map(e => (
                      <option key={e} value={e}>{e}</option>
                    ))}
                  </select>
                  <button
                    onClick={() => {
                      if (!bulkSourceElder || !bulkTargetElder || bulkSourceElder === bulkTargetElder) return;
                      const sourceMatch = bulkSourceElder === "__none__" ? "" : bulkSourceElder;
                      const affected = activeData.filter(f => f.elder === sourceMatch);
                      const next = { ...familyOverrides };
                      affected.forEach(f => {
                        next[f.family] = { ...next[f.family], elder: bulkTargetElder };
                      });
                      setFamilyOverrides(next);
                      setBulkSourceElder("");
                      setBulkTargetElder("");
                    }}
                    disabled={!bulkSourceElder || !bulkTargetElder || bulkSourceElder === bulkTargetElder}
                    style={{
                      padding: "8px 20px", borderRadius: 8, border: "none",
                      background: (bulkSourceElder && bulkTargetElder && bulkSourceElder !== bulkTargetElder) ? "#1d2252" : "#cdd3e3",
                      color: (bulkSourceElder && bulkTargetElder && bulkSourceElder !== bulkTargetElder) ? "#e8ecf4" : "#8b92b3",
                      fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 600,
                      cursor: (bulkSourceElder && bulkTargetElder && bulkSourceElder !== bulkTargetElder) ? "pointer" : "default",
                    }}
                  >
                    Reassign
                  </button>
                </div>
                {bulkSourceElder && (
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#555d80", marginTop: 10}}>
                    {activeData.filter(f => f.elder === (bulkSourceElder === "__none__" ? "" : bulkSourceElder)).length} families will be affected
                  </div>
                )}
              </div>

              {/* Individual reassignment */}
              <div style={{
                background: "rgba(255,255,255,0.9)", border: "1px solid #cdd3e3",
                borderRadius: 10, padding: 20,
              }}>
                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 14, fontWeight: 600, color: "#1d2252", marginBottom: 4}}>
                  Individual Reassignment
                </div>
                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#555d80", marginBottom: 16}}>
                  Select families and reassign them to a new elder
                </div>

                <div style={{display: "flex", gap: 10, marginBottom: 12, flexWrap: "wrap", alignItems: "center"}}>
                  <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#596a8a"}}>
                    {selectedFamilies.size} selected
                  </span>
                  <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, color: "#4a5580"}}>→ Assign to:</span>
                  <select
                    value={reassignTarget}
                    onChange={e => setReassignTarget(e.target.value)}
                    style={{
                      padding: "7px 12px", borderRadius: 8, border: "1px solid #b8c1d6",
                      fontFamily: "'Montserrat', sans-serif", fontSize: 13,
                      color: "#1d2252", background: "#f5f7fb",
                    }}
                  >
                    <option value="">Select elder…</option>
                    {[...new Set(activeData.map(f => f.elder).filter(Boolean))].sort().map(e => (
                      <option key={e} value={e}>{e}</option>
                    ))}
                  </select>
                  <button
                    onClick={() => {
                      if (!reassignTarget || selectedFamilies.size === 0) return;
                      const next = { ...familyOverrides };
                      selectedFamilies.forEach(name => {
                        next[name] = { ...next[name], elder: reassignTarget };
                      });
                      setFamilyOverrides(next);
                      setSelectedFamilies(new Set());
                      setReassignTarget("");
                    }}
                    disabled={!reassignTarget || selectedFamilies.size === 0}
                    style={{
                      padding: "7px 16px", borderRadius: 8, border: "none",
                      background: (reassignTarget && selectedFamilies.size > 0) ? "#1d2252" : "#cdd3e3",
                      color: (reassignTarget && selectedFamilies.size > 0) ? "#e8ecf4" : "#8b92b3",
                      fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 600,
                      cursor: (reassignTarget && selectedFamilies.size > 0) ? "pointer" : "default",
                    }}
                  >
                    Reassign Selected
                  </button>
                </div>

                <div style={{
                  background: "rgba(255,255,255,0.7)", border: "1px solid #cdd3e3",
                  borderRadius: 10, overflow: "hidden",
                }}>
                  <div style={{
                    display: "grid", gridTemplateColumns: "40px 1fr 140px",
                    padding: "10px 16px", borderBottom: "1px solid #cdd3e3",
                    fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 700,
                    color: "#4a5580", textTransform: "uppercase", letterSpacing: 1,
                  }}>
                    <span>
                      <input
                        type="checkbox"
                        checked={selectedFamilies.size === activeData.length && activeData.length > 0}
                        onChange={e => {
                          if (e.target.checked) {
                            setSelectedFamilies(new Set(activeData.map(f => f.family)));
                          } else {
                            setSelectedFamilies(new Set());
                          }
                        }}
                        style={{accentColor: "#0d7a8b"}}
                      />
                    </span>
                    <span>Family</span>
                    <span>Current Elder</span>
                  </div>
                  {[...activeData].sort((a, b) => a.family.localeCompare(b.family)).map((f, i) => (
                    <div key={f.family} style={{
                      display: "grid", gridTemplateColumns: "40px 1fr 140px",
                      padding: "8px 16px", alignItems: "center",
                      borderBottom: i < activeData.length - 1 ? "1px solid #e4e8f2" : "none",
                      background: selectedFamilies.has(f.family) ? "rgba(13,122,139,0.06)" : i % 2 === 0 ? "transparent" : "rgba(245,247,251,0.5)",
                    }}>
                      <span>
                        <input
                          type="checkbox"
                          checked={selectedFamilies.has(f.family)}
                          onChange={e => {
                            const next = new Set(selectedFamilies);
                            if (e.target.checked) next.add(f.family); else next.delete(f.family);
                            setSelectedFamilies(next);
                          }}
                          style={{accentColor: "#0d7a8b"}}
                        />
                      </span>
                      <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, fontWeight: 500, color: "#1d2252"}}>
                        {f.family}
                      </span>
                      <span style={{fontFamily: "'Montserrat', sans-serif", fontSize: 13, color: f.elder ? "#4a5580" : "#596a8a"}}>
                        {f.elder || "—"}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── IMPORT DATA ── */}
          {adminSection === "upload" && (
            <div>
              <div style={{
                background: "rgba(255,255,255,0.9)", border: "1px solid #cdd3e3",
                borderRadius: 10, padding: 32,
              }}>
                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 14, fontWeight: 600, color: "#1d2252", marginBottom: 4}}>
                  Import Record of Fellowship Data
                </div>
                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#555d80", marginBottom: 24}}>
                  Upload a new week's Record of Fellowship file to add prayer requests to the tracker.
                </div>

                <div style={{
                  border: "2px dashed #b8c1d6",
                  borderRadius: 12,
                  padding: "48px 32px",
                  textAlign: "center",
                  background: "rgba(245,247,251,0.5)",
                  cursor: "pointer",
                  transition: "all 0.15s ease",
                }}>
                  <div style={{fontSize: 36, marginBottom: 12, opacity: 0.3}}>📄</div>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 14, fontWeight: 600, color: "#1d2252", marginBottom: 6}}>
                    Drop file here or click to browse
                  </div>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#555d80"}}>
                    Accepts .csv or .xlsx files
                  </div>
                </div>

                <div style={{
                  marginTop: 24, padding: "16px 20px",
                  background: "rgba(13,122,139,0.06)",
                  border: "1px solid rgba(13,122,139,0.2)",
                  borderRadius: 8,
                }}>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, fontWeight: 600, color: "#0d7a8b", marginBottom: 6}}>
                    Expected format
                  </div>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#4a5580", lineHeight: 1.6}}>
                    The file should contain columns for: Family Name, Prayer Request, and Categories.
                    Each row represents one family's prayer request for a given week.
                    The system will match family names to existing records and flag any new families for review.
                  </div>
                </div>

                <div style={{
                  marginTop: 16, padding: "16px 20px",
                  background: "rgba(245,247,251,0.8)",
                  border: "1px solid #cdd3e3",
                  borderRadius: 8,
                }}>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, fontWeight: 600, color: "#555d80", marginBottom: 6}}>
                    Recent imports
                  </div>
                  <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 12, color: "#596a8a", lineHeight: 1.8}}>
                    <div style={{display: "flex", justifyContent: "space-between"}}>
                      <span>Week of Jan 19, 2026</span>
                      <span style={{color: "#15803d"}}>✓ 87 families imported</span>
                    </div>
                    <div style={{display: "flex", justifyContent: "space-between"}}>
                      <span>Week of Jan 12, 2026</span>
                      <span style={{color: "#15803d"}}>✓ 85 families imported</span>
                    </div>
                    <div style={{display: "flex", justifyContent: "space-between"}}>
                      <span>Week of Jan 5, 2026</span>
                      <span style={{color: "#15803d"}}>✓ 83 families imported</span>
                    </div>
                  </div>
                </div>

                <div style={{fontFamily: "'Montserrat', sans-serif", fontSize: 11, color: "#8b92b3", marginTop: 16, textAlign: "center"}}>
                  File upload is not yet functional in this prototype
                </div>
              </div>
            </div>
          )}
        </div>
      )}

    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
