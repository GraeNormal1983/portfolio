const SECTION_CONTENT = {
  "ack": { title: "Acknowledgements", body: "Ushering this paper to its completion was a great joy. The desired information about my family was pouring out of my resources with amazing speed and nearly perfect timing. The original plan was to gather some genealogical facts about a few relatives and organize them into a 25-page paper. I was in awe at what the LORD did to turn this paper into a much larger document with remarkable detail.\n\nOur eldest son, Doug, spent months converting raw data into flowing prose. Alice proofread this document numerous times and decoded the mysterious scrawl of ancient handwriting. Our youngest son, Jeff, took an interest in putting this document online as a PDF — he purchased the web domain, created a beautiful and professional document that is easy for anyone to read.\n\nWith gratitude,\nBruce Stevenson" },
  "intro": { title: "Introduction", body: "This paper is my attempt to provide useful genealogical and historical information for those of us who descend from the union of Ada Mae (Burgess) Stevenson (1927–2022) and Robert Glenn Stevenson (1926–2011). It is not only offered to my children but to their children and all subsequent generations.\n\nThe following questions will be addressed: Where did our ancestors come from? How did they live their lives? What were their families like? What was their culture like? Were they people of faith? It is hoped that the information learned from the lives of our ancestors provides a lens through which we can view the contexts we currently face." },
  "james-cheever": { title: "James Cheever", subtitle: "11th Great Grandfather · Mansfield, England · 1560–1616", fam: "cheever", body: 'Our story begins with the grandparents of Ezekiel Cheever in England. James Cheever lived in Mansfield, Nottinghamshire, England circa 1560–1616. Nothing is known about his parents. James died in Mansfield at the age of 56 and was a "Yeoman" — a classification referring to one who owns and cultivates land.\n\nOn September 14, 1582, when James was 22, he married Agnes Walker in Mansfield. They had four children: William, Richard, James, and Christopher Cheever.' },
  "william-cheever": { title: "William Cheever", subtitle: "10th Great Grandfather · London, England · b. 1584", fam: "cheever", body: 'William Cheever was born circa 1584 to James and Agnes Cheever. He was a "Skinner" by trade. On June 4, 1613, "William Cheever admitted to Freedom" and became a skinner in his own right.\n\nOn January 6th, 1613, he married Margaret Newman in All Hallowes Church, Lombard Street, London. A note with their marriage record states "not in the due place," indicating they were probably married by license but not in the Church of England. They were the parents of Ezekiel Cheever.' },
  "ezekiel-cheever": { title: "Headmaster Ezekiel Cheever", subtitle: "9th Great Grandfather · London → Boston · 1614–1708", fam: "cheever", hi: true, body: "Ezekiel was born on January 25, 1614 in London. His grandfather was a yeoman and his father was a skinner; but Ezekiel was most noted as Headmaster of the Boston Latin School. All his sons graduated from Harvard College. Quite a rise in a single generation.\n\nHe entered Emmanuel College, Cambridge University in 1633, and felt called by God to teach Puritan children in the New England colonies. He arrived in Boston in June, 1637, at age 23.\n\nHe taught in New England a total of seventy years, the last thirty-eight as master of the Boston Latin School — the most famous college preparatory school for young men. Its many famous pupils included Benjamin Franklin, Cotton Mather, John Hancock, and Samuel Adams.\n\nEzekiel died in Boston on August 21, 1708, at age 94. At his funeral, Cotton Mather gave the eulogy, praising Cheever for his \"untiring abjuration of the devil.\"" },
  "thomas-cheever": { title: "Reverend Thomas Cheever", subtitle: "8th Great Grandfather · Ipswich → Chelsea, MA · 1658–1749", fam: "cheever", body: "Thomas was born on August 23, 1658 in Ipswich, MA. He graduated from Harvard College in 1677 and was ordained at Malden on July 27, 1681.\n\nThomas faced charges of \"scandalous immoralities\" and was given a \"loving dismission.\" His father Ezekiel attended the trial and \"pathetically desired his soul might speak\" but was not permitted.\n\nHe was later ordained as the first minister of Rumney Marsh. He died in Chelsea on November 27, 1749 at age 91. His brother Ezekiel Jr. gained notoriety for his part in the Salem Witch Trials of 1692." },
  "thomas-cheever-jr": { title: "Thomas Cheever, Jr.", subtitle: "7th Great Grandfather · Lynn, MA · d. 1753", fam: "cheever", body: "Thomas bought over 111 acres of farmland and was the Representative for Lynn in 1726–1727 and 1740–1742. Historian Hassam reported he was \"an enterprising man, and the Church, Town, and County records give ample evidence of his ceaseless activity.\"\n\nWith Ebenezer Merriam, Thomas built in 1723 the first mill on Saugus River." },
  "edward-cheever": { title: "Reverend Edward Cheever", subtitle: "6th Great Grandfather · Lynn → Eastham, MA · 1717–1794", fam: "cheever", body: "Edward graduated from Harvard College in 1737 — the third and last of our Cheever ancestors to do so. He became pastor of the Third Church of Lynn in 1739.\n\nOne account notes he \"carelessly neglected to keep records\" during his ministry. Edward died August 17, 1794, at age 77." },
  "samuel-cheever": { title: "Reverend Samuel Cheever", subtitle: "5th Great Grandfather · Eastham, MA → Stillwater, NY · 1752–1814", fam: "cheever", body: "Samuel married Thankfull Hammond on May 27, 1781 — merging the Cheever and Hammond lines. Despite being viewed as \"uneducated,\" one diarist wrote: \"This Doctor was a smart Preacher. He did not read and call it Preaching: but he Preached.\"\n\nA raging battle over theology grew in Hartland, Vermont. Samuel tried to force members to pledge they would \"not hold religious fellowship or communion with the Universalists and the Methodists.\" This split the congregation.\n\nHe died in December 1814 in Stillwater, New York, \"in the midst of his valuable work.\"" },
  "elizabeth-hammond": { title: "Elizabeth Penn Hammond and Descendants", subtitle: "10th Great Grandmother · London → Massachusetts", fam: "hammond", body: "Elizabeth Penn Hammond was a widow who emigrated from London with four children to the Massachusetts Bay Colony in the 1630s. The Hammond line intersects with the Cheever family through the marriage of Rev. Samuel Cheever and Thankfull Hammond in 1781.\n\nThis union opened a genealogical pathway to Mayflower passengers Francis Cooke and Richard Warren." },
  "hammond-genealogy": { title: "Our Family Genealogy from the Perspective of the Hammond Line", fam: "hammond", body: "The Hammond family genealogy reveals connections to some of the earliest European settlers in New England, including direct descent from Mayflower passengers Francis Cooke and his son John Cooke, as well as Richard Warren." },
  "abner-cheever": { title: "Abner Hersey Cheever", subtitle: "4th Great Grandfather · Brockton, MA → Indiana · 1787–1853", fam: "cheever", hi: true, body: "Abner fought in the War of 1812, married Polly McClay, and lived with his sister Thankful in Vermont. In 1816, he set out westward with his young family.\n\nHis 18 letters to Thankful, written between 1816 and 1837, document this extraordinary journey — from wagon troubles on the Ohio River, to teaching school in Kentucky, to the devastating death of his wife Polly: \"Polly is no more... torn from my pleading bosom.\"\n\nDespite crushing losses — deaths of his first wife, multiple children, and relentless illness — the letters trace a deepening spiritual faith. \"After wading through deep water of afflictions and drinking deeply of the cup of woe, He has once more caused His face to shine upon me.\"\n\nHe became a licensed Methodist circuit preacher. His final letter reads like the Book of Job — persecution, stolen livestock, and the death of his son Horace. Yet he wrote: \"I cannot think of it as unfair because God had prompted my heart to seek after Him.\"\n\nHis gravestone reads: \"I've borne the burden in the heat of the day... I have fought a good fight, I have finished my course, I have kept the faith.\"" },
  "william-f-cheever": { title: "William Franklin \"Frank\" Cheever", subtitle: "3rd Great Grandfather · Vermont → Sand Creek, IN · 1814–1874", fam: "cheever", body: "Frank began the journey from Vermont to Indiana at age two. The death of his mother on his fourth birthday was the peak of his chaotic early life. He met Amelia Jones when her family purchased 160 acres next to Abner's property. They married in 1834.\n\nAmelia was fondly called \"Grandma Cheever\" by those in the Fish Creek Church. Frank died April 11, 1874 at age 59. Amelia outlived him by 25 years." },
  "william-a-cheever": { title: "William Abner Cheever", subtitle: "2nd Great Grandfather · Sand Creek, IN · b. 1841", fam: "cheever", body: "William Abner was born in 1841 in Sand Creek Township. He served in the Civil War and returned to farm the family land — cementing the Cheever identity as Indiana farming people." },
  "clifford-cheever": { title: "Clifford Hayes Cheever", subtitle: "Great Grandfather · Sand Creek, IN · b. 1877", fam: "cheever", body: "Clifford continued the multi-generational farming tradition established by his great-grandfather Abner when he first settled in Jennings County in 1817." },
  "neva-burgess": { title: "Neva Etta Cheever Burgess", subtitle: "Grandmother · Sand Creek, IN · b. 1902", fam: "cheever", body: "Neva was the daughter of Clifford Hayes Cheever. She married Frank Burgess. Through Neva, the Cheever line that began with James Cheever in 1560s England continued into the 20th century." },
  "paternal-grandfather": { title: "My Paternal Grandfather's Ancestry", fam: "moss", body: "The first featured family is named Moss. George Moss was born October 17, 1786 in Virginia. He married Lydia Bilderback in 1808. They moved to Indiana in 1823. George \"purchased from a squatter a claim\" for \"one two-year-old colt\" and became one of the large landowners of Clay County." },
  "lydia-moss": { title: "A Word About Lydia Moss", fam: "moss", body: "Lydia \"practiced midwifery and treated women and children for thirty years.\" She traveled \"through unbroken wilderness, the roads being but bridle paths\" and treated over 2,500 patients. She \"is probably the only woman in Clay County to deliver a woman in childbirth with instruments.\"" },
  "cw-moss": { title: "Major Charles Wesley Moss", subtitle: "2nd Great Grandfather · Kentucky → Clay County, IN · 1820–1900", fam: "moss", hi: true, body: "C.W. Moss fought at Buena Vista in the Mexican-American War, was elected sheriff, named Sugar Ridge Township, and founded the town of Ashboro.\n\nWhen the Civil War broke out, he again enlisted — despite promising his family he would not. At the Battle of Marks' Mills, his horse was shot out from under him. He was captured and imprisoned at Camp Ford, Tyler, Texas.\n\nAfter a prisoner exchange, he volunteered to care for 40 ill men unable to travel. While in Indianapolis, he \"had command of the troops that guarded the State Capitol while the deceased President Lincoln lay there in state.\"\n\nHis obituary: \"An Octogenarian, Pioneer, Soldier of Two Wars, County Officer, An Intelligent, Upright, Christian Farmer Citizen.\"" },
  "john-c-moss": { title: "A Word About John Coleman Moss", fam: "moss", body: "John Coleman Moss served in the same regiment as his uncle C.W. Moss. Both were captured at Marks' Mills. John wrote a riveting chapter about the escape of four prisoners and their journey by foot from Camp Ford in Tyler, Texas to Fort Steele, Arkansas." },
  "stevensons-england": { title: "The Stevensons from England", fam: "stevenson", body: "Three generations of coal miners beginning with James Stevenson in Staffordshire County, England. The English government's coal miners were struggling financially, leading to a massive exodus to the United States in the 1850s." },
  "stephen-stevenson": { title: "Stephen and Betty Stevenson", subtitle: "2nd Great Grandparents · Staffordshire → Ohio · 1824–1896", fam: "stevenson", body: "Stephen left England in 1852 aboard the \"DeWitt Clinton.\" Betty Welsby arrived in 1857 aboard the \"City of Washington.\" They married October 15, 1858 in Ohio.\n\nThey lived in \"patch\" communities — remote mining settlements with company-owned stores. They eventually settled in Vienna, Ohio. Stephen willed 25 acres each to sons William and Moses — and $50 to son James from his first marriage, who had somehow found his father from England." },
  "william-stevenson": { title: "William Thomas Stevenson", subtitle: "Great Grandfather · Steubenville, OH → Clay County, IN · 1859–1930", fam: "stevenson", body: "Will grew up in a coal mining \"patch\" community. He made his way to Clay County, Indiana, where he married Anna \"Annie\" Moss, daughter of Major C.W. Moss. They married December 29, 1888.\n\nAnnie birthed 12 children; 10 survived. This marriage united the Stevenson and Moss lines." },
  "barbers": { title: "My Paternal Grandmother's Story Begins with the Barbers", fam: "barber_long", body: "The Barber family was among the farming families of Clay County. Aaron Gleason Barber and the Long family formed part of the interconnected web of families near Cory, Indiana." },
  "long-jeffers": { title: "The Long and Jeffers Farm Families", fam: "barber_long", body: "The intersection of the Long and Jeffers farming families in Clay County would eventually connect to the Stevenson line through the marriage of Ernest Stevenson and Sarah Marie Long." },
  "connections": { title: "The Barber, Moss, and Long Connections with the Stevensons", body: "These five farming families — Barber, Moss, Long, Jeffers, and Stevenson — were deeply intertwined through marriage and geography in Clay County, Indiana." },
  "ernest-stevenson": { title: "Ernest and Sarah Stevenson", subtitle: "Grandparents · Clay County, IN · b. 1893", fam: "stevenson", body: "Ernest Lloyd Stevenson was the third of William and Annie's children. He married Sarah Marie Long, connecting the Stevenson family with the Long farming family. Their son Robert would be among the first to leave the family farm." },
  "robert-stevenson": { title: "Robert Glenn and Ada Mae Stevenson", subtitle: "Parents · Indiana · 1926–2011 / 1927–2022", fam: "stevenson", hi: true, body: "Robert came from the Stevenson/Moss paternal line — generations of English coal miners, Indiana pioneers, and Clay County farmers. Ada Mae descended from the Cheever/Hammond maternal line — Puritan educators, New England ministers, and frontier settlers.\n\nRobert was one of several who left the family farm, marking the \"untethering from the land\" that Bruce documents in this paper." },
  "bruce-stevenson": { title: "Bruce Stevenson", subtitle: "Author · Indiana", fam: "stevenson", body: "Bruce Stevenson is the author of this family history, connecting 400 years of ancestors from England to Indiana. His work is animated by a conviction that \"a proper understanding of our family history may serve as a warning, a prescription, an encouragement, or a map forward; but it always serves as a blessing from God.\"" },
  "stories-important": { title: "Stories are Important", fam: "cheever", body: "The stories of our ancestors may inform and unite us as families, and encourage us to honor God in our efforts to live according to our callings." },
  "postscript": { title: "Postscript", body: "This paper closes with a challenge: look for personal applications as you consider the questions emanating from the diverse personal and family experiences of our ancestors." },
};

function useIsMobile() {
  const [m, setM] = useState(typeof window !== "undefined" && window.innerWidth < 768);
  useEffect(() => {
    const h = () => setM(window.innerWidth < 768);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return m;
}

  const [exp, setExp] = useState(new Set(TOC.filter(t => t.sections).map(t => t.id)));
  const toggle = (id) => setExp(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });

  useEffect(() => {

  const click = (id) => { onSectionClick(id); if (isMobile) onClose(); };

function FamilyTreeModal({ onClose, activeSection }) {
  const modalRef = useRef(null);
  const closeRef = useRef(null);

  // Focus trap + Escape key
  useEffect(() => {
    closeRef.current?.focus();
    const handleKey = (e) => {
      if (e.key === "Escape") { onClose(); return; }
      if (e.key === "Tab") {
        const focusable = modalRef.current?.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
        if (!focusable || focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", handleKey);
    return () => document.removeEventListener("keydown", handleKey);
  }, [onClose]);

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}

  const scrollingTo = useRef(false);

  const toggleLine = useCallback((lineId) => {
    setActiveLines((prev) => {
      const next = new Set(prev);
      if (next.has(lineId)) { if (next.size > 1) next.delete(lineId); } else next.add(lineId);
      return next;
    });
  }, []);

  const contentSections = ALL_SECTION_IDS.filter((id) => SECTION_CONTENT[id]);

  // Scrollspy (Contents mode only)
  useEffect(() => {
    const container = contentRef.current;
    if (!container) return;
    const observer = new IntersectionObserver(
      (entries) => {
        if (scrollingTo.current || navMode !== "toc") return;
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const id = entry.target.getAttribute("data-section-id");
            if (id) setActiveSection(id);
          }
        }
      },
      { root: container, rootMargin: "-10% 0px -80% 0px", threshold: 0 }
    );
    container.querySelectorAll("[data-section-id]").forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, [topTab, navMode]);

    setActiveSection(id);
    const el = contentRef.current?.querySelector(`[data-section-id="${id}"]`);

          <div ref={contentRef} style={{ flex: 1, overflowY: "auto", padding: isMobile ? "24px 16px" : "32px 24px" }}>
            <div style={{ maxWidth: "700px", margin: "0 auto" }}>
              <header style={{ marginBottom: "36px", textAlign: "center" }}>
                <div style={{ fontSize: "9.5px", fontWeight: 700, letterSpacing: "2px", textTransform: "uppercase", color: C.meta, marginBottom: "10px" }}>The Stevenson Family History</div>
                <h1 style={{ margin: "0 0 6px", fontSize: isMobile ? "24px" : "30px", fontFamily: "'Source Serif 4', Georgia, serif", fontWeight: 700, color: C.text, lineHeight: 1.25, letterSpacing: "-0.5px" }}>
                  A Guided Tour of Our Ancestors and Their Worlds
                </h1>
                <p style={{ margin: "0 0 6px", fontSize: "14.5px", fontFamily: "'Source Serif 4', Georgia, serif", color: C.meta, fontStyle: "italic" }}>Messages for Our Lives</p>
                <p style={{ margin: 0, fontSize: "12.5px", color: C.meta }}>By Bruce L. Stevenson · December 2025</p>
              </header>

              {contentSections.map((id) => {
                const sec = SECTION_CONTENT[id];
                const fam = sec.fam ? FAMILY_LINES[sec.fam] : null;
                const partItem = TOC.find((t) => t.id === id);
                const isPart = partItem && partItem.title;
                return (
                  <section key={id} data-section-id={id} aria-label={sec.title} style={{ marginBottom: "36px", scrollMarginTop: "20px" }}>
                    {isPart && (
                      <div style={{ display: "flex", alignItems: "center", gap: "14px", marginBottom: "20px" }} role="separator">
                        <div style={{ height: "1px", flex: 1, background: "#e0dbd5" }} />
                        <div style={{ fontSize: "13px", fontFamily: "'Source Serif 4', Georgia, serif", fontWeight: 700, color: fam?.color || C.meta, whiteSpace: "nowrap" }}>
                          {partItem.label}: {partItem.title}
                        </div>
                        <div style={{ height: "1px", flex: 1, background: "#e0dbd5" }} />
                      </div>
                    )}
                    {sec.hi && fam && (
                      <span style={{ fontSize: "9px", fontWeight: 700, letterSpacing: "0.8px", textTransform: "uppercase", color: fam.color, background: `${fam.color}10`, padding: "3px 8px", borderRadius: "3px", display: "inline-block", marginBottom: "8px" }}>Key Figure</span>
                    )}
                    <h2 style={{ margin: "0 0 4px", fontSize: isMobile ? "20px" : "24px", fontFamily: "'Source Serif 4', Georgia, serif", fontWeight: 700, color: C.text, lineHeight: 1.3 }}>{sec.title}</h2>
                    {sec.subtitle && <h3 style={{ margin: "0 0 4px", fontSize: "13px", color: fam?.color || C.meta, fontWeight: 500 }}>{sec.subtitle}</h3>}
                    {fam && (
                      <span style={{ fontSize: "10px", fontWeight: 500, color: fam.color, background: `${fam.color}0c`, padding: "2px 8px", borderRadius: "10px", border: `1px solid ${fam.color}18`, display: "inline-block", marginBottom: "12px" }}>{fam.label} Line</span>
                    )}
                    <div style={{ fontSize: isMobile ? "14px" : "15px", fontFamily: "'Source Serif 4', Georgia, serif", color: C.body, lineHeight: 1.8 }}>
                      {sec.body.split("\n\n").map((p, i) => (
                        <p key={i} style={{ margin: i === 0 ? "0 0 14px" : "14px 0" }}>{p}</p>
                      ))}
                    </div>
                  </section>
                );
              })}

              <footer style={{ marginTop: "40px", padding: "20px", textAlign: "center", borderTop: "1px solid #e8e2dc" }}>
                <p style={{ margin: "0 0 8px", fontSize: "13.5px", fontFamily: "'Source Serif 4', Georgia, serif", fontStyle: "italic", color: C.meta, lineHeight: 1.6, maxWidth: "500px", marginLeft: "auto", marginRight: "auto" }}>
                  "A proper understanding of our family history <em style={{ textDecoration: "underline" }}>always</em> serves as a blessing from God when our history is viewed as something worthy of meditation."
                </p>
                <p style={{ margin: 0, fontSize: "11px", color: C.meta }}>thefamilytour.org</p>
              </footer>
            </div>
          </div>
        ) : (
          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "40px", overflow: "auto" }}>
            <div style={{ maxWidth: "520px", textAlign: "center" }}>
              <div style={{ fontSize: "28px", marginBottom: "16px" }} aria-hidden="true">🌿</div>
              <h2 style={{ margin: "0 0 8px", fontSize: "22px", fontFamily: "'Source Serif 4', Georgia, serif", fontWeight: 700, color: C.text }}>The Family Record</h2>
              <p style={{ fontSize: "14px", fontFamily: "'Source Serif 4', Georgia, serif", color: C.meta, lineHeight: 1.65 }}>
                A living document for future generations. Coming soon.
              </p>
            </div>
          </div>
        )}

        {topTab === "tour" && (
          <button
            onClick={() => setTreeOpen(true)}
            aria-label="View family tree"
            style={{
              position: "fixed",
              bottom: isMobile ? "20px" : "28px",
              right: isMobile ? "20px" : "28px",
              width: "52px", height: "52px",
              borderRadius: "50%", border: "none",
              background: C.text, color: "#fff", fontSize: "22px",
              cursor: "pointer",
              boxShadow: "0 4px 16px rgba(0,0,0,0.2)",
              display: "flex", alignItems: "center", justifyContent: "center",
              transition: "transform 0.2s, box-shadow 0.2s",
              zIndex: 50,
            }}
            onMouseEnter={(e) => { e.currentTarget.style.transform = "scale(1.08)"; e.currentTarget.style.boxShadow = "0 6px 24px rgba(0,0,0,0.3)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.transform = "scale(1)"; e.currentTarget.style.boxShadow = "0 4px 16px rgba(0,0,0,0.2)"; }}
          >
            <span aria-hidden="true">🌳</span>
          </button>
        )}
      </main>

      {treeOpen && <FamilyTreeModal onClose={() => setTreeOpen(false)} activeSection={activeSection} />}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FamilyTourApp));
  </script>
</body>
</html>
